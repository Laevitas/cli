name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: node --test test/*.test.mjs
      - uses: actions/setup-go@v5
        with:
          go-version: "1.25"
      - run: go test ./... -v
        env:
          GOPROXY: https://proxy.golang.org,direct
      - run: go vet ./...
        env:
          GOPROXY: https://proxy.golang.org,direct

  browser:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: '1.25'
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: web-terminal/package-lock.json
      - run: npm ci --ignore-scripts && npm test && npm run build
        working-directory: web-terminal
      - run: npx playwright install --with-deps chromium && npm run test:browser
        working-directory: web-terminal
