name: Configure terminal DNS

on:
  workflow_dispatch:
    inputs:
      mode:
        description: 'Inspect DNS access, or configure only the two terminal records'
        type: choice
        options: [status, domains]
        default: status

permissions:
  contents: read
concurrency:
  group: terminal-dns-configuration
  cancel-in-progress: false

jobs:
  configure:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: node scripts/terminal-pages.mjs "$TERMINAL_DNS_MODE"
        env:
          TERMINAL_DNS_MODE: ${{ inputs.mode }}
          CF_API_TOKEN: ${{ secrets.CF_DNS_API_TOKEN || secrets.CF_API_TOKEN }}
          CF_ACCOUNT_ID: ${{ secrets.CF_ACCOUNT_ID }}
