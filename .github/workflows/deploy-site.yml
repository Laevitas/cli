name: Deploy site

on:
  push:
    branches: [main]
    paths:
      - "site/**"
      - "install.ps1"
      - "install.sh"
      - "wrangler.jsonc"
      - ".github/workflows/deploy-site.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      # Sync the canonical installers into site/ so cli.laevitas.ch serves
      # the same content as raw.githubusercontent.com/laevitas/cli/main/.
      - name: Sync install scripts into site/
        run: |
          cp install.ps1 site/install.ps1
          cp install.sh  site/install.sh

      - name: Deploy Worker (cli.laevitas.ch)
        uses: cloudflare/wrangler-action@v3
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CF_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CF_ACCOUNT_ID }}
        with:
          command: deploy
